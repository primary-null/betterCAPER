permissions:
  contents: read

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "22 6 * * 2"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1b549b2c5f0034e5c353a7b65d0f3e3c4d1b7e0f
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@1b549b2c5f0034e5c353a7b65d0f3e3c4d1b7e0f

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1b549b2c5f0034e5c353a7b65d0f3e3c4d1b7e0f
      with:
        category: "/language:${{matrix.language}}"
